<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI SIGNAL PRO</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background:
                radial-gradient(circle at top, #172554 0%, #080d18 42%, #03060b 100%);
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        .header {
            text-align: center;
            padding: 18px 10px 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .header h1 span {
            color: #00e5ff;
        }

        .header p {
            color: #8fa4bd;
            margin-top: 7px;
            font-size: 13px;
        }

        /* ================================
           CONTROL PANEL
        ================================= */

        .control-panel {
            background: rgba(12, 20, 34, 0.95);
            border: 1px solid #20334d;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,.35);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .control-group label {
            display: block;
            color: #91a4bb;
            font-size: 12px;
            margin-bottom: 7px;
            font-weight: 700;
        }

        select {
            width: 100%;
            height: 46px;
            background: #0b1322;
            border: 1px solid #29415f;
            color: #ffffff;
            border-radius: 10px;
            padding: 0 12px;
            outline: none;
            font-size: 14px;
        }

        select:focus {
            border-color: #00d9ff;
        }

        .scan-btn {
            height: 46px;
            min-width: 145px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, #00d9ff, #0077ff);
            color: #ffffff;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 8px 25px rgba(0, 174, 255, .25);
        }

        .scan-btn:hover {
            transform: translateY(-1px);
        }

        .scan-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        /* ================================
           STATUS
        ================================= */

        .status-bar {
            margin-top: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .connection {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8fa4bd;
            font-size: 12px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #64748b;
        }

        .dot.online {
            background: #00e676;
            box-shadow: 0 0 10px rgba(0,230,118,.7);
        }

        .dot.error {
            background: #ff3b30;
            box-shadow: 0 0 10px rgba(255,59,48,.7);
        }

        .last-update {
            color: #64748b;
            font-size: 11px;
        }

        /* ================================
           SIGNAL CARD
        ================================= */

        .signal-card {
            background: rgba(8, 16, 28, .97);
            border: 1px solid #20334d;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 15px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0,0,0,.4);
        }

        .signal-title {
            color: #91a4bb;
            font-size: 12px;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .signal-main {
            font-size: 42px;
            font-weight: 1000;
            margin-top: 8px;
            line-height: 1.1;
        }

        .signal-main.call {
            color: #00e676;
            text-shadow: 0 0 20px rgba(0,230,118,.25);
        }

        .signal-main.put {
            color: #ff5252;
            text-shadow: 0 0 20px rgba(255,82,82,.25);
        }

        .signal-main.wait {
            color: #ffc107;
        }

        .signal-main.detected {
            color: #ff9800;
            font-size: 30px;
        }

        .signal-sub {
            color: #8195ab;
            font-size: 13px;
            margin-top: 7px;
        }

        .signal-meta {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .meta-box {
            background: #0b1422;
            border: 1px solid #1e3047;
            border-radius: 12px;
            padding: 12px;
        }

        .meta-label {
            color: #71859d;
            font-size: 10px;
            text-transform: uppercase;
        }

        .meta-value {
            margin-top: 5px;
            font-size: 16px;
            font-weight: 800;
        }

        /* ================================
           TIMER
        ================================= */

        .timer-box {
            margin-top: 18px;
            background: #0b1422;
            border: 1px solid #1e3047;
            border-radius: 12px;
            padding: 13px;
        }

        .timer-text {
            color: #91a4bd;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .progress {
            width: 100%;
            height: 7px;
            background: #172335;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00e5ff, #0077ff);
            transition: width .5s linear;
        }

        /* ================================
           SECTION
        ================================= */

        .section {
            background: rgba(8, 16, 28, .97);
            border: 1px solid #20334d;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 15px;
        }
