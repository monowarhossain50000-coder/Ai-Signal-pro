<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signal By Monowar</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: white;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .data-badge {
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .live {
            background: #063d25;
            color: #39ff9b;
        }

        .proxy {
            background: #4a3500;
            color: #ffd45c;
        }

        .card {
            background: #151f32;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        select,
        button {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        select {
            background: #202c42;
            color: white;
        }

        button {
            background: #1677ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .signal {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            padding: 20px;
            border-radius: 12px;
            background: #202c42;
            margin-top: 10px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #2b3850;
        }

        .row:last-child {
            border-bottom: none;
        }

        .value {
            font-weight: bold;
        }

        .status {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            background: #202c42;
            margin-bottom: 15px;
        }

        .warning {
            color: #ffd45c;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
        }

        .error {
            color: #ff6b6b;
        }

        .small {
            text-align: center;
            color: #9ba8bd;
            font-size: 13px;
            margin-top: 15px;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>📊 SIGNAL BY MONOWAR</h1>

    <div id="dataBadge" class="data-badge live">
        🟢 LIVE MARKET DATA
    </div>

    <div class="card">

        <label for="market">
            Market
        </label>

        <select id="market" onchange="updatePairs()">

            <option value="real">
                REAL MARKET
            </option>

            <option value="otc">
                OTC MARKET
            </option>

        </select>


        <label for="symbol">
            Currency / Asset
        </label>

        <select id="symbol">

            {% for pair in real_pairs %}

            <option value="{{ pair }}">
                {{ pair }}
            </option>

            {% endfor %}

        </select>


        <label for="timeframe">
            Timeframe
        </label>

        <select id="timeframe">

            <option value="1">
                1 Minute
            </option>

            <option value="2">
                2 Minutes
            </option>

            <option value="3">
                3 Minutes
            </option>

            <option value="5">
                5 Minutes
            </option>

            <option value="10">
                10 Minutes
            </option>

            <option value="15">
                15 Minutes
            </option>

            <option value="30">
                30 Minutes
            </option>

            <option value="60">
                60 Minutes
            </option>

            <option value="240">
                240 Minutes
            </option>

        </select>


        <button onclick="generateSignal()">
            🚀 GENERATE SIGNAL
        </button>

    </div>


    <div class="status" id="status">
        Ready
    </div>


    <div class="card">

        <div class="signal" id="signal">
            WAIT
        </div>

        <div id="warning" class="warning"></div>

    </div>


    <div class="card">

        <div class="row">
            <span>Symbol</span>
            <span class="value" id="resultSymbol">
                -
            </span>
        </div>

        <div class="row">
            <span>Timeframe</span>
            <span class="value" id="resultTimeframe">
                -
            </span>
        </div>

        <div class="row">
            <span>Price</span>
            <span class="value" id="price">
                -
            </span>
        </div>

        <div class="row">
            <span>EMA 50</span>
            <span class="value" id="ema50">
                -
            </span>
        </div>

        <div class="row">
            <span>RSI 14</span>
            <span class="value" id="rsi14">
                -
            </span>
        </div>

        <div class="row">
            <span>Candle</span>
            <span class="value" id="candle">
                -
            </span>
        </div>

        <div class="row">
            <span>Trend</span>
            <span class="value" id="trend">
                -
            </span>
        </div>

        <div class="row">
            <span>Confidence</span>
            <span class="value" id="confidence">
                -
            </span>
        </div>

    </div>


    <div class="small">
        Signal By Monowar
        <br>
        EMA 50 + RSI 14 + Candle
    </div>

</div>


<script>

const realPairs = [

    {% for pair in real_pairs %}

    "{{ pair }}",

    {% endfor %}

];


const otcPairs = [

    {% for pair in otc_pairs %}

    "{{ pair }}",

    {% endfor %}

];


function updatePairs() {

    const market =
        document.getElementById("market").value;


    const symbol =
        document.getElementById("symbol");


    const badge =
        document.getElementById("dataBadge");


    symbol.innerHTML = "";


    let pairs;


    if (market === "otc") {

        pairs = otcPairs;

        badge.className =
            "data-badge proxy";

        badge.textContent =
            "🟡 OTC PROXY DATA";

    }

    else {

        pairs = realPairs;

        badge.className =
            "data-badge live";

        badge.textContent =
            "🟢 LIVE MARKET DATA";

    }


    pairs.forEach(function(pair) {

        const option =
            document.createElement("option");

        option.value = pair;

        option.textContent = pair;

        symbol.appendChild(option);

    });


    document.getElementById("signal")
        .textContent = "WAIT";


    document.getElementById("status")
        .textContent = "Ready";


    document.getElementById("warning")
        .textContent = "";

}


async function generateSignal() {

    const market =
        document.getElementById("market").value;


    const symbol =
        document.getElementById("symbol").value;


    const timeframe =
        document.getElementById("timeframe").value;


    const status =
        document.getElementById("status");


    const signal =
        document.getElementById("signal");


    const warning =
        document.getElementById("warning");


    status.classList.remove("error");


    status.textContent =
        "Loading market data...";


    signal.textContent =
        "LOADING...";


    warning.textContent =
        "";


    try {

        const url =
            `/api/market?market=${encodeURIComponent(market)}&symbol=${encodeURIComponent(symbol)}&timeframe=${encodeURIComponent(timeframe)}`;


        const response =
            await fetch(url);


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Server error"
            );

        }


        document.getElementById(
            "resultSymbol"
        ).textContent =
            data.symbol || symbol;


        document.getElementById(
            "resultTimeframe"
        ).textContent =
            data.timeframe || "-";


        document.getElementById(
            "price"
        ).textContent =
            data.price ?? "-";


        document.getElementById(
            "ema50"
        ).textContent =
            data.ema50 ?? "-";


        document.getElementById(
            "rsi14"
        ).textContent =
            data.rsi14 ?? "-";


        document.getElementById(
            "candle"
        ).textContent =
            data.candle || "-";


        document.getElementById(
            "trend"
        ).textContent =
            data.trend || "-";


        document.getElementById(
            "confidence"
        ).textContent =
            data.confidence !== undefined
                ? data.confidence + "%"
                : "-";


        signal.textContent =
            data.signal || "NO SIGNAL";


        if (data.signal === "CALL / UP") {

            signal.textContent =
                "🟢 CALL / UP";

        }

        else if (
            data.signal === "PUT / DOWN"
        ) {

            signal.textContent =
                "🔴 PUT / DOWN";

        }

        else if (
            data.signal === "MARKET CLOSED"
        ) {

            signal.textContent =
                "🔒 MARKET CLOSED";

        }

        else {

            signal.textContent =
                data.signal || "WAIT";

        }


        if (
            data.otc_proxy === true
        ) {

            warning.textContent =
                "⚠️ OTC signal uses proxy market data, not direct Quotex OTC candles.";

        }


        status.textContent =
            data.message ||
            "Signal generated successfully";


    }

    catch (error) {

        signal.textContent =
            "NO SIGNAL";


        status.textContent =
            error.message;


        status.classList.add(
            "error"
        );

    }

}

</script>

</body>
</html>
