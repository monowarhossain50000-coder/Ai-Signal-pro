<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Signal Pro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 92%;
            max-width: 430px;
            background: #0d1b2a;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .subtitle {
            color: #9fb3c8;
            margin: 8px 0 25px;
        }

        select {
            width: 100%;
            padding: 14px;
            margin: 7px 0;
            border: 0;
            border-radius: 10px;
            background: #16283b;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #16a085;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .signal-box {
            margin-top: 25px;
            padding: 22px;
            border-radius: 15px;
            background: #13263a;
        }

        #signal {
            font-size: 28px;
            font-weight: bold;
            margin: 12px 0;
        }

        #details {
            color: #9fb3c8;
        }

        .status {
            margin-top: 18px;
            color: #72e6a8;
            font-size: 13px;
        }

        .warning {
            margin-top: 18px;
            color: #8295a8;
            font-size: 11px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 AI SIGNAL PRO</h1>

    <div class="subtitle">
        Live Market Analysis
    </div>

    <select id="pair">
        <option value="EUR/USD">EUR/USD</option>
        <option value="GBP/USD">GBP/USD</option>
        <option value="USD/JPY">USD/JPY</option>
        <option value="EUR/JPY">EUR/JPY</option>
        <option value="GBP/JPY">GBP/JPY</option>
    </select>

    <select id="timeframe">
        <option value="1min">1 Minute</option>
    </select>

    <button onclick="generateSignal()">
        ⚡ GENERATE SIGNAL
    </button>

    <div class="signal-box">

        <div>LIVE SIGNAL</div>

        <div id="signal">
            WAITING...
        </div>

        <div id="details">
            Press Generate Signal
        </div>

    </div>

    <div class="status">
        🟢 System Online
    </div>

    <div class="warning">
        Market analysis is informational only. No guaranteed results.
    </div>

</div>

<script>

async function generateSignal() {

    const signal = document.getElementById("signal");
    const details = document.getElementById("details");

    signal.innerText = "⏳ ANALYZING...";
    details.innerText = "Fetching market data...";

    try {

        const response = await fetch("/api/market");
        const data = await response.json();

        if (data.error) {
            signal.innerText = "⚠️ ERROR";
            details.innerText = data.error;
            return;
        }

        if (!data.values || data.values.length === 0) {
            signal.innerText = "⚠️ NO DATA";
            details.innerText = "Market data unavailable";
            return;
        }

        const latest = data.values[0];

        signal.innerText = "📊 DATA RECEIVED";

        details.innerText =
            "EUR/USD • 1 Minute • Price: " + latest.close;

    } catch (error) {

        signal.innerText = "⚠️ ERROR";
        details.innerText =
            "Could not connect to market data";

    }
}

</script>

</body>
</html>
